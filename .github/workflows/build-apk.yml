name: Build Meter Reader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q MeterReader_GitHub_Ready.zip -d project
          echo "ZIP extracted"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          SETTINGS=$(find project -name settings.gradle.kts -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create JVM compatibility fix
        run: |
          cat > "$HOME/jvm-fix.gradle" <<'EOF'

          allprojects {

              plugins.withId("com.android.application") {
                  android {
                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }
              }

              plugins.withId("com.android.library") {
                  android {
                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }
              }

              tasks.configureEach { task ->
                  if (task.name.toLowerCase().contains("kotlin")) {
                      try {
                          task.kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                      }
                  }
              }
          }

          EOF

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle \
            --no-daemon \
            --init-script "$HOME/jvm-fix.gradle" \
            assembleDebug

      - name: Find APK
        run: |
          echo "APK files:"
          find "${PROJECT_DIR}" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeterReader-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
